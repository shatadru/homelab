apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labforge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:shatadru/homelab.git
    path: charts/labforge
    targetRevision: main
    helm:
      valueFiles:
        - values-homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: labforge
  # The ntfy PVC is dynamically provisioned (local-path), so the API server
  # stamps spec.volumeName on bind. That field is immutable after creation, so
  # ArgoCD nulling it fails every sync and blocks the PostSync auth bootstrap
  # hook (leaving oauth2-proxy without client-id/client-secret). Ignore it.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
