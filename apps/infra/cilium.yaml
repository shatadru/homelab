apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.20.0
    helm:
      values: |-
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
              - "10.42.0.0/16"
            clusterPoolIPv4MaskSize: 24

        kubeProxyReplacement: true

        gatewayAPI:
          enabled: true

        k8sServiceHost: "192.168.0.163"
        k8sServicePort: "6443"

        operator:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
