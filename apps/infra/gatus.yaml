apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: gatus

  source:
    repoURL: https://twin.github.io/helm-charts
    chart: gatus
    targetRevision: 1.5.0
    helm:
      values: |
        ingress:
          enabled: true
          hosts:
            - gatus.homelab

        persistence:
          enabled: true
          size: 200Mi

        serviceMonitor:
          enabled: true
          interval: 60s
          scrapeTimeout: 30s

        config:
          endpoints:
            - name: Immich
              group: apps
              url: https://photos.shatadru.in
              interval: 60s
              conditions:
                - "[STATUS] == 200"

            - name: shatadru.in
              group: websites
              url: https://shatadru.in
              interval: 60s
              conditions:
                - "[STATUS] == 200"

            - name: sonalstudio.in
              group: websites
              url: https://sonalstudio.in/
              interval: 60s
              conditions:
                - "[STATUS] == 200"

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
