[tox]
envlist = yamllint, helm-charts
skipsdist = true

# ──────────────────────────────────────────────
# yamllint: whole-repository YAML linting
# Scan "." relative to the repo root so the ignore globs
# (charts/*/templates/, charts/*/charts/) match.
# ──────────────────────────────────────────────
[testenv:yamllint]
deps =
    yamllint
commands =
    yamllint -c {toxinidir}/.yamllint.yml .

# ──────────────────────────────────────────────
# helm-charts: dependency build + lint + template for every chart
# Requires the Helm CLI on PATH (https://helm.sh)
# The script is bash (arrays, pipefail); run it with bash, not sh
# (on Debian/Ubuntu /bin/sh is dash and would fail).
# ──────────────────────────────────────────────
[testenv:helm-charts]
passenv =
    HELM_BIN
allowlist_externals =
    bash
commands =
    bash {toxinidir}/scripts/helm-chart-test.sh {posargs}

# ──────────────────────────────────────────────
# kind-charts: install the Kind-friendly chart subset
# Needs Docker, Kind, kubectl, and Helm on PATH.
# CREATE_CLUSTER=0 still refuses a context other than kind-<cluster-name>
# on localhost. CI sets KUBECONFIG to the kind-action file and uses this.
# ──────────────────────────────────────────────
[testenv:kind-charts]
passenv =
    CREATE_CLUSTER
    DELETE_CLUSTER
    CLUSTER_NAME
    HELM_TIMEOUT
    HELM_BIN
    KIND_NODE_IMAGE
    KUBECONFIG
    CHARTS_DIR
allowlist_externals =
    bash
commands =
    bash {toxinidir}/scripts/kind-chart-install.sh
