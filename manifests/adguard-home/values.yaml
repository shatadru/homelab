# Values for the upstream HelmForge adguard-home chart (inflated by Kustomize).
# The Deployment is patched in kustomization.yaml to run with hostNetwork; see
# docs/adguard-home.md.

config:
  # The complete AdGuardHome.yaml — filters, DNS rewrites, and the
  # bcrypt-protected admin user — lives in this out-of-band Secret, never in
  # Git. It replaces the per-machine /etc/hosts entries for the homelab.
  existingSecret: adguard-home-config

# The host-network pod pins the DNS listener to the node IP on :53.
# systemd-resolved only owns the loopback (127.0.0.53/54) and 5353 is mDNS
# (avahi), so 192.168.0.163:53 is free. AdGuard's DHCP then advertises .163
# (its interface address) by default, which is a valid resolver. The .53
# Service VIP still publishes :53 and forwards here for manual clients.
containerPorts:
  dns: 53

persistence:
  conf:
    enabled: true
    storageClass: local-path
    size: 512Mi
  work:
    enabled: true
    storageClass: local-path
    # Query logs, statistics, downloaded filter lists, and DHCP leases.
    size: 5Gi

service:
  web:
    type: ClusterIP
  dns:
    type: LoadBalancer
    loadBalancerIP: 192.168.0.53
    annotations:
      metallb.io/ip-allocated-from-pool: homelab
    # This single-node cluster always has the endpoint locally. Preserving
    # client addresses makes query logs useful and avoids unnecessary SNAT.
    externalTrafficPolicy: Local

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: homelab-selfsigned
  hosts:
    - host: adguard.home.shatadru.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: adguard-home-tls
      hosts:
        - adguard.home.shatadru.in

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi

# DHCP needs a raw socket bound to the LAN interface; hostNetwork alone is not
# enough because the container drops all capabilities by default.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN
