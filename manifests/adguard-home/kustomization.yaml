apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: adguard-home

# Inflate the upstream chart instead of wrapping/vendoring it. Renovate's
# kustomize manager tracks the `version` below, so bumps stay automatic.
helmCharts:
  - name: adguard-home
    repo: https://repo.helmforge.dev
    version: 1.5.5
    releaseName: adguard-home
    namespace: adguard-home
    valuesFile: values.yaml

# The chart has no hostNetwork value, and Helm cannot patch a dependency's
# rendered output. The DHCP server must see L2 broadcasts on the physical LAN
# interface, so patch hostNetwork. The AdGuard config lives in an out-of-band
# Secret, so a second init container also enforces the node-IP DNS bind and
# port: a wildcard :53 bind collides with the host's systemd-resolved.
patches:
  - target:
      kind: Deployment
      name: adguard-home-adguard-home
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: patch-dns-bind
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              f=/opt/adguardhome/conf/AdGuardHome.yaml
              [ -f "$f" ] || exit 0
              sed -i '/^dns:/,/^[a-zA-Z]/ {
                s/^[[:space:]]*- 0\.0\.0\.0$/  - 192.168.0.163/
                s/^[[:space:]]*port: [0-9]*$/  port: 53/
              }' "$f"
              sed -i 's/^[[:space:]]*range_end: 192\.168\.0\.255$/    range_end: 192.168.0.254/' "$f"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: conf
              mountPath: /opt/adguardhome/conf
