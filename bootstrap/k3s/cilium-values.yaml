# Cilium configuration for the initial single-node K3s cluster.

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"
    clusterPoolIPv4MaskSize: 24

# Match charts/cilium. K3s must start with disable-kube-proxy, or both
# programs will program Service traffic.
kubeProxyReplacement: "true"
# charts/cilium sets this to none. The chart default is lbipam, which
# would hold LoadBalancer addresses until the GitOps release takes over.
defaultLBServiceIPAM: none

# K3s API server.
k8sServiceHost: "192.168.0.163"
k8sServicePort: "6443"

# Single-node bootstrap.
# Increase to 2+ when the cluster has multiple suitable nodes.
operator:
  replicas: 1
