# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  # Let super-linter post commit statuses (silences the 403 noise in logs).
  statuses: write
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: ".*charts/nfs-csi/templates/storageclass\\.yaml$"
          # kubeval cannot validate Argo CD Custom Resources (it tries to fetch the
          # Application schema from kubernetesjsonschema.dev, a broken host), so it
          # fails every run on any apps/*.yaml change. Helm rendering and YAML
          # linting for the whole repo are covered by the "Quality Checks" workflow.
          VALIDATE_KUBERNETES_KUBEVAL: false
