name: Quality Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-charts:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          # Pinned so CI matches the version the chart tests were validated
          # against; bump deliberately and re-run the tests.
          version: "4.3.0"

      - name: Install tox
        run: pip install tox

      - name: Test all charts
        run: tox -e helm-charts

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tox
        run: pip install tox

      - name: Lint YAML
        run: tox -e yamllint

  kind-charts:
    name: Kind chart install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "4.3.0"

      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: homelab-ci
          node_image: kindest/node:v1.37.0
          kubeconfig: ${{ runner.temp }}/homelab-ci.kubeconfig

      - name: Install tox
        run: pip install tox

      - name: Install charts on Kind
        env:
          KUBECONFIG: ${{ runner.temp }}/homelab-ci.kubeconfig
          CREATE_CLUSTER: "0"
          DELETE_CLUSTER: "0"
          CLUSTER_NAME: homelab-ci
          HELM_TIMEOUT: 15m
        run: tox -e kind-charts
