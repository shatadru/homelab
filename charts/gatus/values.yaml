gatus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-selfsigned
    hosts:
      - gatus.home.shatadru.in
    tls:
      - secretName: gatus-tls
        hosts:
          - gatus.home.shatadru.in

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "200m"
      memory: "128Mi"

  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s

  config:
    endpoints:
      - name: Immich
        group: apps
        url: https://photos.shatadru.in
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: shatadru.in
        group: websites
        url: https://shatadru.in
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: sonalstudio.in
        group: websites
        url: https://sonalstudio.in/
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Argo CD
        group: internal
        url: https://192.168.0.11
        interval: 60s
        headers:
          Host: argocd.home.shatadru.in
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"

      - name: Grafana
        group: internal
        url: https://192.168.0.11
        interval: 60s
        headers:
          Host: grafana.home.shatadru.in
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"

      - name: Prometheus
        group: internal
        url: https://192.168.0.11
        interval: 60s
        headers:
          Host: prometheus.home.shatadru.in
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"

      - name: Alertmanager
        group: internal
        url: https://192.168.0.11
        interval: 60s
        headers:
          Host: alertmanager.home.shatadru.in
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"

      - name: Gatus
        group: internal
        url: https://192.168.0.11
        interval: 60s
        headers:
          Host: gatus.home.shatadru.in
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"
