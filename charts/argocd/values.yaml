argo-cd:
  configs:
    params:
      server.insecure: true

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      tls: true
      hostname: argocd.home.shatadru.in

  controller:
    metrics:
      serviceMonitor:
        enabled: false

  repoServer:
    metrics:
      serviceMonitor:
        enabled: false

  applicationSet:
    metrics:
      serviceMonitor:
        enabled: false
