argo-cd:
  configs:
    params:
      server.insecure: true
    secret:
      # Let ArgoCD own argocd-secret (server.secretkey / admin.password).
      # With the default createSecret=true the chart renders an empty
      # argocd-secret and a self-sync wipes the runtime-generated keys, which
      # broke the ArgoCD API (500 "server.secretkey is missing") and reset the
      # admin password. createSecret=false leaves the secret to ArgoCD.
      createSecret: false

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      tls: true
      hostname: argocd.home.shatadru.in
    certificate:
      enabled: true
      domain: argocd.home.shatadru.in
      issuer:
        group: cert-manager.io
        kind: ClusterIssuer
        name: homelab-selfsigned
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "500m"
        memory: "512Mi"

  controller:
    metrics:
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: "1Gi"

  repoServer:
    metrics:
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "500m"
        memory: "1Gi"

  applicationSet:
    metrics:
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "200m"
        memory: "256Mi"

  notifications:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "200m"
        memory: "256Mi"

  dex:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"
