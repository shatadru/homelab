# Values for the CodeOpsMS Paperless-ngx chart. Since this is a wrapper chart,
# every upstream setting is nested under `paperless-ngx`.
paperless-ngx:
  fullnameOverride: paperless-ngx

  config:
    # Pre-create paperless-secrets with PAPERLESS_SECRET_KEY. The database
    # password is supplied separately by paperless-db-credentials.
    url: https://paperless.home.shatadru.in
    # The env values below are delivered via envFrom on a Secret, which
    # Kubernetes only injects at pod start, so ArgoCD would report Synced while
    # the pod kept serving stale config. Bump this on every env change to force
    # a rollout (this is the chart's own rollout-revision annotation).
    secretRevision: 1
    secretKey:
      existingSecret:
        name: paperless-secrets
        key: PAPERLESS_SECRET_KEY
    database:
      engine: postgresql
      host: paperless-postgres-rw.paperless-ngx.svc.cluster.local
      port: 5432
      name: paperless
      user: paperless
      password: ""
      existingSecret:
        name: paperless-db-credentials
        passwordKey: password

  env:
    PAPERLESS_ALLOWED_HOSTS: paperless.home.shatadru.in,paperless.tail8fbf37.ts.net,paperless.shatadru.in,*
    # Django rejects POSTs (login, uploads) from origins not listed here, so
    # every hostname users reach Paperless through needs an entry: the Traefik
    # host, the tailnet MagicDNS name, and the public Cloudflare Tunnel host.
    PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.home.shatadru.in,https://paperless.tail8fbf37.ts.net,https://paperless.shatadru.in
    # Cloudflare Tunnel and Traefik both terminate TLS and forward plain HTTP,
    # so Django would otherwise build http:// origins and fail the CSRF check
    # even for hosts listed above. Trust the proxy's protocol header instead.
    PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
    PAPERLESS_TIME_ZONE: UTC
    PAPERLESS_OCR_LANGUAGE: eng

    # Paperless derives its worker pool from the host CPU count (16 here), not
    # the container's CPU limit, so it oversubscribed a 1-CPU cgroup 16:1 and
    # spent its time being throttled rather than working. Pin the pool to match
    # the limit below.
    PAPERLESS_TASK_WORKERS: "2"
    PAPERLESS_THREADS_PER_WORKER: "2"

  podSecurityContext:
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  # TASK_WORKERS x THREADS_PER_WORKER = 4 CPU-bound threads during OCR, so the
  # limit has to allow 4 cores or the pool is throttled again. The node has 16
  # cores and was running at ~0.05 of them, so there is ample headroom.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4000m"
      memory: "4Gi"

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClass: nas-nfs
    retain: true

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-selfsigned
    hosts:
      - host: paperless.home.shatadru.in
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paperless-ngx-tls
        hosts:
          - paperless.home.shatadru.in

  # Use the managed CNPG instance below instead of the chart's archived
  # bitnamilegacy PostgreSQL dependency.
  postgresql:
    enabled: false

  valkey:
    internal: true
    dataStorage:
      className: nas-nfs
      keepPvc: true
