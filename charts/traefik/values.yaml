traefik:
  providers:
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: true
      ingressClass: traefik

  ingressClass:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "200m"
      memory: "256Mi"

  gateway:
    enabled: false

  service:
    annotations:
      metallb.io/ip-allocated-from-pool: homelab
      metallb.io/loadBalancerIPs: 192.168.0.11
    spec:
      type: LoadBalancer

  ports:
    web:
      # The chart runs as a non-root user, so the process listens above 1024.
      # The Service still publishes port 80, and that port redirects to HTTPS.
      port: 8000
      exposedPort: 80
      protocol: TCP
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https

  api:
    dashboard: true
    insecure: false

  ingressRoute:
    dashboard:
      enabled: false

  log:
    level: INFO

  deployment:
    replicas: 1
