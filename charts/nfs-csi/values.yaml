csi-driver-nfs: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "200m"
    memory: "256Mi"

storageClass:
  enabled: true
  name: nas-nfs
  server: 192.168.100.2
  share: /volume1/k8s
  mountPermissions: "0755"
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  mountOptions:
    - nfsvers=4.2
