# Wrapper values for the `opencloud` OCI dependency (Tim-herbie/opencloud-helm v3.0.0).
#
# IMPORTANT — matches the bjw-s/wrapper-chart lesson already learned on Immich/Homepage:
# because the dependency is declared with `name: opencloud` in Chart.yaml, ALL of its
# values must be nested one level under the `opencloud:` key below. The upstream chart
# ALSO has its own top-level `opencloud:` section for core app settings — so that section
# ends up double-nested as `opencloud.opencloud.*` here. This is correct, not a typo.
#
# DESIGN NOTE (changed after initial draft): the chart's own "minimal setup" doc and its
# CI-tested e2e values both keep Collabora + Tika at their default `enabled: true` — neither
# example disables them. Disabling them (our original plan) walks into undocumented gaps
# (missing `collaboration.enabled` default, SEARCH_EXTRACTOR_TYPE hardcoded to "tika"
# regardless of whether tika is enabled). So this version follows the chart's tested path
# instead: Collabora + Tika stay ON, and only the genuinely environment-specific bits
# (storage, ingress, secrets) are overridden. Still worth a `helm template . --debug`
# before merging, same as always.

opencloud:
  # ---------------------------------------------------------------------
  # GLOBAL
  # ---------------------------------------------------------------------
  global:
    domain:
      opencloud: cloud.home.shatadru.in
      collabora: collabora.home.shatadru.in
      companion: companion.home.shatadru.in
    tls:
      # We terminate TLS at Traefik (homelab-selfsigned), not inside the chart
      enabled: false
    storage:
      storageClass: nas-nfs

  # ---------------------------------------------------------------------
  # CORE APP SETTINGS (upstream chart's own `opencloud:` block)
  # ---------------------------------------------------------------------
  opencloud:
    replicas: 1
    logLevel: info

    # Manually created secret, same pattern as immich-db-credentials /
    # homepage-secrets. Must contain key: adminPassword
    existingSecret: opencloud-admin-credentials

    # No demo users for a personal instance — but the chart's own minimal-setup
    # doc notes createDemoUsers is "necessary for admin user creation" with the
    # integrated IDM. Leaving as chart default (true) rather than guessing here;
    # flip to false once confirmed an admin account can be created another way.
    createDemoUsers: true

    # Left at chart default ("tika") since Tika is enabled below.

    # Small config/metadata volume — separate from the posixfs user-data PVC
    # below. This is app *state*, not user *data* — same category as Immich's
    # CNPG/Valkey (local-path), not its NFS-backed library. NOTE:
    # global.storage.storageClass is NOT read by this PVC's template (checked
    # directly in pvc.yaml) — must be set here explicitly, or it stays
    # unbound with "no storage class is set" since neither local-path nor
    # nas-nfs is marked default in this cluster.
    persistence:
      data:
        storageClass: local-path

    resources:
      requests:
        cpu: 128m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi

    # -- Storage: NAS-backed posixfs, consistent with "NFS for large durable
    #    media" principle (same reasoning as Immich's library PV).
    #    Requires NFS >= 4.2 with flock + xattr support — the nas-nfs
    #    StorageClass's mountOptions must be pinned to nfsvers=4.2, not the
    #    default nfsvers=3 (this bit us once already; confirm before reuse).
    storage:
      mode: posixfs
      posixfs:
        persistence:
          enabled: true
          size: 200Gi          # placeholder — size to actual NAS headroom
          storageClass: nas-nfs
          accessMode: ReadWriteOnce   # ReadWriteMany only needed if replicas > 1

    smtp:
      enabled: false
    antivirus:
      enabled: false
    policies:
      enabled: false

  # ---------------------------------------------------------------------
  # COLLABORA (document editing) — chart default (enabled), following the
  # CI-tested path instead of disabling it
  # ---------------------------------------------------------------------
  collabora:
    enabled: true
    ssl:
      enabled: false   # TLS terminated at Traefik, same as opencloud itself

  # `collaboration` (WOPI service) is a SEPARATE key from `collabora` (the
  # editor itself) — deployment.yaml checks .Values.collaboration.enabled
  # directly, and this key has NO default in the upstream chart's values.yaml
  # at all (a genuine chart gap). Must be set explicitly regardless of
  # whether collabora is on, or `helm template` fails with a nil pointer on
  # opencloud/templates/opencloud/deployment.yaml:221. Set true since
  # Collabora is enabled above and needs the WOPI bridge to function.
  collaboration:
    enabled: true

  # ---------------------------------------------------------------------
  # WEB EXTENSIONS / TIKA — chart defaults (enabled)
  # ---------------------------------------------------------------------
  webExtensions:
    enabled: true
  tika:
    enabled: true
    resources:
      requests:
        cpu: 100m

  # ---------------------------------------------------------------------
  # INGRESS — plain Kubernetes Ingress via Traefik
  # (matches the live Immich/Homepage convention, not the chart's
  #  Gateway API default; confirmed by the chart's own ingress_test.yaml
  #  that plain ingress.enabled renders a real Ingress object)
  # ---------------------------------------------------------------------
  httpRoute:
    enabled: false

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-selfsigned

  # ---------------------------------------------------------------------
  # MONITORING
  # ---------------------------------------------------------------------
  monitoring:
    enabled: true
