homarr:
  strategyType: Recreate

  rbac:
    enabled: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: "1Gi"

  service:
    enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-selfsigned
    hosts:
      - host: homarr.home.shatadru.in
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: homarr-tls
        hosts:
          - homarr.home.shatadru.in

  persistence:
    homarrDatabase:
      enabled: true
      storageClassName: local-path
