homarr:
  # Paused: not using Homarr right now. Scale to 0 keeps the release and its
  # local-path PVC (sqlite) intact while running zero pods. Set back to 1 to
  # resume. Deployment uses Recreate strategy, so the RWO PVC stays attached.
  replicaCount: 0

  strategyType: Recreate

  rbac:
    enabled: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: "1Gi"

  service:
    enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-selfsigned
    hosts:
      - host: homarr.home.shatadru.in
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: homarr-tls
        hosts:
          - homarr.home.shatadru.in

  persistence:
    homarrDatabase:
      enabled: true
      storageClassName: local-path
