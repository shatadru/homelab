cilium:
  ipam:
    mode: cluster-pool
    operator:
      clusterPoolIPv4PodCIDRList:
        - "10.42.0.0/16"
      clusterPoolIPv4MaskSize: 24

  kubeProxyReplacement: true
  defaultLBServiceIPAM: none
  gatewayAPI:
    enabled: true
  ingressController:
    enabled: true

  k8sServiceHost: "192.168.0.163"
  k8sServicePort: "6443"

  operator:
    replicas: 1
