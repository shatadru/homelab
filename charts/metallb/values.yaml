homelabPool:
  enabled: true
  addresses:
    - 192.168.0.10-192.168.0.80
  # The node is multi-homed: enp4s0 serves the NAS network (192.168.100.0/24)
  # and the 25G/WiFi ports are unused. With an empty interface list MetalLB
  # creates an ARP responder on every NIC and answers for the VIP on networks
  # where it does not belong. Announce only on the LAN interface.
  interfaces:
    - enp3s0

metallb:
  # This homelab uses Layer 2 advertisement only; BGP is not required.
  frrk8s:
    enabled: false
  speaker:
    frr:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"

  controller:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"
