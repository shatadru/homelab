{{- if .Values.homelabPool.enabled }}
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab
{{- with .Values.homelabPool.interfaces }}
  interfaces:
{{- range . }}
    - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
