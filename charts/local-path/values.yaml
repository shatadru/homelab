---
local-path-provisioner:
  storageClass:
    name: local-path
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
  nodePathMap:
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
        - /var/lib/rancher/k3s/storage

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "200m"
      memory: "256Mi"
