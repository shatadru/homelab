apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labforge.fullname" . }}
  labels:
    {{- include "labforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "labforge.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "labforge.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "labforge.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: labforge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "labforge.fullname" . }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "agent.tokenSecretName is required" .Values.agent.tokenSecretName }}
                  key: {{ .Values.agent.tokenKey }}
          volumeMounts:
            - name: ssh-keys
              mountPath: /etc/labforge/ssh
              readOnly: true
            {{- if .Values.tailscale.secretName }}
            - name: tailscale-key
              mountPath: /etc/labforge/tailscale
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ssh-keys
          secret:
            secretName: {{ .Values.sshKeys.secretName }}
        {{- if .Values.tailscale.secretName }}
        - name: tailscale-key
          secret:
            secretName: {{ .Values.tailscale.secretName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
