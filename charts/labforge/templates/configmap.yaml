apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "labforge.fullname" . }}
  labels:
    {{- include "labforge.labels" . | nindent 4 }}
data:
  MODE: {{ .Values.config.mode | quote }}
  HOST_MODE: {{ .Values.config.hostMode | quote }}
  AGENT_URL: {{ required "agent.url is required (labforge-agent on the KVM host)" .Values.agent.url | quote }}
  VM_NAME_PREFIX: {{ .Values.config.vmNamePrefix | quote }}
  DEFAULT_MEMORY_MB: {{ .Values.config.defaultMemoryMb | quote }}
  DEFAULT_VCPUS: {{ .Values.config.defaultVcpus | quote }}
  DEFAULT_DISK_GB: {{ .Values.config.defaultDiskGb | quote }}
  RESOURCE_BUDGET_PERCENT: {{ .Values.config.resourceBudgetPercent | quote }}
  GRAPHICS_TYPE: {{ .Values.config.graphicsType | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SSH_PUBLIC_KEYS_FILE: "/etc/labforge/ssh/{{ .Values.sshKeys.key }}"
  {{- if .Values.tailscale.secretName }}
  TAILSCALE_AUTH_KEY_FILE: "/etc/labforge/tailscale/{{ .Values.tailscale.key }}"
  {{- end }}
