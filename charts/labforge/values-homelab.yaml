# Live homelab values for the LabForge stack.
#
# Login uses GitHub OAuth (oauth2-proxy). Create the credentials Secret first:
#
#   kubectl -n labforge create secret generic labforge-github-oauth \
#     --from-literal=client-id=<github-oauth-app-client-id> \
#     --from-literal=client-secret=<github-oauth-app-client-secret> \
#     --from-literal=cookie-secret="$(openssl rand -hex 16)"
#
# Access is restricted to a single GitHub user via the oauth2-proxy provider
# override below (githubConfig.users). That allowlist lives here in the homelab
# values (local config), not in the upstream chart.

global:
  labforge:
    ingressHost: labforge.tail8fbf37.ts.net
    github:
      # The chart's fail-closed check only understands org/team/allowAll; the
      # real restriction is the githubConfig.users allowlist in the provider
      # override below, so this stays true to satisfy the chart render check.
      allowAll: true

labforge:
  image:
    repository: ghcr.io/shatadru/labforge
    # Empty tag means the chart appVersion (1.2.0).

  agent:
    url: http://192.168.0.163:8443
    tokenSecretName: labforge-agent-token
    tokenKey: token

  sshKeys:
    secretName: labforge-ssh-keys
    key: authorized_keys

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Tailscale Ingress in front of oauth2-proxy.
  ingress:
    enabled: true
    className: tailscale
    tls: true

  # GitHub OAuth login (oauth2-proxy).
  auth:
    enabled: true
    provider: github
    github:
      existingSecret: labforge-github-oauth

  # Local override: allow only specific GitHub users. Replaces the chart's
  # bundled provider block (which uses org/team) so the allowlist is config here,
  # not code in the chart.
  oauth2-proxy:
    alphaConfig:
      configData:
        providers:
          - id: github
            provider: github
            name: GitHub
            clientID: ${OAUTH2_PROXY_CLIENT_ID}
            clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
            githubConfig:
              users:
                - ansh5611

  # One-room chat backed by ntfy (ClusterIP only).
  chat:
    enabled: true
    topic: labforge

  # ntfy history on the local-path StorageClass.
  ntfy:
    persistence:
      enabled: true
      storageClass: local-path
      size: 1Gi
