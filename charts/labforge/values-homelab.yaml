# Live homelab values for the LabForge stack.
#
# Login uses GitHub OAuth (oauth2-proxy). Create the credentials Secret first:
#
#   kubectl -n labforge create secret generic labforge-github-oauth \
#     --from-literal=client-id=<github-oauth-app-client-id> \
#     --from-literal=client-secret=<github-oauth-app-client-secret> \
#     --from-literal=cookie-secret="$(openssl rand -hex 16)"
#
# Create the username allowlist ConfigMap (keep real usernames out of Git):
#
#   kubectl -n labforge create configmap labforge-github-users \
#     --from-literal=users="<github-username>[,<another>]"
#
# Access is limited to the GitHub username allowlist held in the
# `labforge-github-users` ConfigMap (key `users`, comma-separated). That
# ConfigMap is created directly in the cluster and intentionally kept out of
# Git. global.labforge.github.org / .team can scope access further.

global:
  labforge:
    ingressHost: labforge.tail8fbf37.ts.net
    github:
      # Restriction comes from the username allowlist ConfigMap, so keep the
      # open catch-all off.
      allowAll: false

labforge:
  image:
    repository: ghcr.io/shatadru/labforge
    # Empty tag means the chart appVersion (1.4.0).

  agent:
    url: http://192.168.0.163:8443
    tokenSecretName: labforge-agent-token
    tokenKey: token

  sshKeys:
    secretName: labforge-ssh-keys
    key: authorized_keys

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Tailscale Ingress in front of oauth2-proxy.
  ingress:
    enabled: true
    className: tailscale
    tls: true

  # GitHub OAuth login (oauth2-proxy).
  auth:
    enabled: true
    provider: github
    github:
      existingSecret: labforge-github-oauth

  # Workaround for chart 1.4.0: it exports the upstream as
  # OAUTH2_PROXY_UPSTREAM (singular), but oauth2-proxy binds the env by its
  # config key, i.e. OAUTH2_PROXY_UPSTREAMS. The unknown env is ignored, so the
  # generated oauth2_proxy.cfg keeps the subchart default upstream
  # (file:///dev/null) and every proxied request 404s. Supply the real upstream
  # through that generated config instead. Drop once the chart fix is released.
  oauth2-proxy:
    config:
      upstreams:
        - http://labforge-labforge:80

  # One-room chat backed by ntfy (ClusterIP only).
  chat:
    enabled: true
    topic: labforge

  # ntfy history on the local-path StorageClass.
  ntfy:
    persistence:
      enabled: true
      storageClass: local-path
      size: 1Gi
