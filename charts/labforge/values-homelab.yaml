# Live homelab values for the LabForge stack.
#
# Before the first sync, create the credentials Secret in the labforge namespace:
#
#   kubectl -n labforge create secret generic labforge-auth \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=STATIC_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=cookie-secret="$(openssl rand -base64 32)"

global:
  labforge:
    ingressHost: labforge.tail8fbf37.ts.net
    issuer: https://pocket-id.tail8fbf37.ts.net
    lanHost: id.home.shatadru.in

labforge:
  image:
    repository: ghcr.io/shatadru/labforge
    # Empty tag means the chart appVersion (1.1.0).

  agent:
    url: http://192.168.0.163:8443
    tokenSecretName: labforge-agent-token
    tokenKey: token

  sshKeys:
    secretName: labforge-ssh-keys
    key: authorized_keys

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Tailscale Ingress in front of oauth2-proxy.
  ingress:
    enabled: true
    className: tailscale
    tls: true

  # Pocket ID + oauth2-proxy login.
  auth:
    enabled: true
    existingSecret: labforge-auth
    lanClassName: traefik
    lanClusterIssuer: homelab-selfsigned
    bootstrap:
      enabled: true

  pocket-id:
    host: pocket-id.tail8fbf37.ts.net
    config:
      core:
        internalAppUrl: http://labforge-pocket-id:80
      ui:
        settings:
          app:
            # First signup becomes admin; set to disabled after registering.
            allowUserSignups: open
    persistence:
      data:
        enabled: true
        storageClass: local-path
        size: 1Gi

  # One-room chat backed by ntfy (ClusterIP only).
  chat:
    enabled: true
    topic: labforge

  # ntfy history on the local-path StorageClass.
  ntfy:
    persistence:
      enabled: true
      storageClass: local-path
      size: 1Gi
