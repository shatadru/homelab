# Homelab wrapper around the released LabForge chart.
#
# Upstream values live under `labforge:` (the dependency name); shared values
# under the top-level `global:` propagate down to the LabForge subcharts. The
# login and chat stack stays off here so the chart still renders in CI;
# values-homelab.yaml turns it on for the cluster.

global:
  labforge:
    ingressHost: ""
    issuer: ""
    lanHost: ""

labforge:
  ingress:
    enabled: false
  auth:
    enabled: false
  chat:
    enabled: false
