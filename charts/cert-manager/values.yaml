cert-manager:
  crds:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "200m"
      memory: "128Mi"

  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "200m"
        memory: "256Mi"

  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "200m"
        memory: "512Mi"
