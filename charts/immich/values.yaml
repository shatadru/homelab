immich:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.2.4

  immich:
    persistence:
      library:
        existingClaim: immich-library

  valkey:
    enabled: true
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "200m"
                memory: "256Mi"

  server:
    enabled: true
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
            resources:
              requests:
                cpu: "2"
                memory: "4Gi"
              limits:
                cpu: "4"
                memory: "8Gi"
            env:
              DB_HOSTNAME: immich-postgres-rw.immich.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: homelab-selfsigned
        hosts:
          - host: immich.home.shatadru.in
            paths:
              - path: "/"
                service:
                  identifier: main
        tls:
          - secretName: immich-tls
            hosts:
              - immich.home.shatadru.in

      tailscale:
        enabled: true
        className: tailscale
        annotations:
          # Force the Tailscale operator's L7 Ingress proxy to run in non-userspace
          # (kernel) mode. By default the operator runs L7 Ingress proxies with
          # userspace netstack, which caps upload throughput at ~20-45 Mbps and
          # drops large POSTs (tailscale#20893, tailscale#15784). That broke
          # Immich uploads (client reaches 100% then hangs; proxy logs
          # "http: proxy error: unexpected EOF").
          tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
        hosts:
          - host: immich
            paths:
              - path: "/"
                service:
                  identifier: main
        tls:
          - hosts:
              - immich

  machine-learning:
    enabled: true
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi
