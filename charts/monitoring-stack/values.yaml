kube-prometheus-stack:
  alertmanager:
    ingress:
      enabled: true
      hosts:
        - alertmanager.home.shatadru.in

  grafana:
    ingress:
      enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: "1Gi"
      hosts:
        - grafana.home.shatadru.in

  prometheus:
    ingress:
      enabled: true
      hosts:
        - prometheus.home.shatadru.in
